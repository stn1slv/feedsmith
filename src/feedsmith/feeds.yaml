feeds:
  boomi:
    title: "Boomi Blog"
    extractor: wordpress_api
    url: "https://boomi.com/wp-json/wp/v2/blog"
    site_url: "https://boomi.com/blog/"
    max_items: 20

  kong:
    title: "Kong Blog"
    extractor: nextjs_blog
    url: "https://konghq.com/blog/page/1"
    site_url: "https://konghq.com/blog/"
    max_items: 20

  bump:
    title: "Bump.sh Blog"
    extractor: bump_blog
    url: "https://bump.sh/blog/"
    site_url: "https://bump.sh/blog/"
    max_items: 20

  treblle:
    title: "Treblle Blog"
    extractor: sanity_blog
    url: "https://y0t5b9p5.apicdn.sanity.io/v2021-10-21/data/query/production"
    site_url: "https://treblle.com/blog/"
    max_items: 20

  # Computers & Technology books (English) from the Google Books API. Adding a new
  # query is a feeds.yaml-only change: copy a block and change the id, title, query,
  # and site_url. Multi-word terms are quoted to force phrase matching.
  books-mulesoft:
    title: "Books: MuleSoft (Computers & Technology)"
    extractor: google_books
    url: "https://www.googleapis.com/books/v1/volumes"
    site_url: "https://books.google.com/books?q=MuleSoft+subject:Computers"
    query: "MuleSoft"
    max_items: 20

